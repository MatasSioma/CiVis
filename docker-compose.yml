services:
  db:
    image: pgvector/pgvector:0.8.7-pg16
    environment:
      POSTGRES_DB: civis
      POSTGRES_USER: civis
      POSTGRES_PASSWORD: civis
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: server -dir=/data -s3 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "8333:8333"
      - "8888:8888"
    volumes:
      - seaweeddata:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  backend:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgres://civis:civis@db:5432/civis
      DEBUG: "true"
      FRONTEND_URL: http://localhost:5173
      CSRF_TRUSTED_ORIGINS: http://localhost:5173
    env_file:
      - .env
    depends_on:
      - db
      - seaweedfs

  frontend:
    build: ./frontend
    command: npm run dev -- --host 0.0.0.0
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
  seaweeddata:
